name: ARES-7 Mobile Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/mobile-offline-app
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The mobile branch currently tracks the Flutter app sources but not
      # the generated android/ and ios/ platform scaffolding.
      - name: Generate Flutter platform projects
        run: flutter create --project-name ares7_mobile --platforms=android,ios .

      # flutter create generates a template test that references MyApp, but
      # this app's actual root widget is AresMobileApp. Remove the unused
      # scaffold test until project-specific widget tests are added.
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ares7-mobile-android-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
