name: ARES-7 Mobile iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/mobile-offline-app
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ios.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ios.yml"

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The mobile branch tracks the Flutter sources but not generated iOS scaffolding.
      - name: Generate Flutter iOS project
        run: flutter create --project-name ares7_mobile --platforms=ios .

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Build iOS release without Apple signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ARES-7-iOS-unsigned.zip

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ares7-mobile-ios-unsigned
          path: mobile/ARES-7-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
